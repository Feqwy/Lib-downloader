name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "MangaLibDownloader-Windows" main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MangaLibDownloader-Windows
          path: dist/MangaLibDownloader-Windows.exe


  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Binary
        run: |
          pyinstaller --onefile --name "MangaLibDownloader-Linux" main.py

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: MangaLibDownloader-Linux
          path: dist/MangaLibDownloader-Linux


  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Binary
        run: |
          pyinstaller --onefile --name "MangaLibDownloader-macOS" main.py

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: MangaLibDownloader-macOS
          path: dist/MangaLibDownloader-macOS


  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Extension ZIP
        run: |
          zip -r extension.zip extension/

      - name: Upload Extension
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: extension.zip


  create-release:
    needs: [build-windows, build-linux, build-macos, package-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: MangaLibDownloader-Windows
          path: ./release

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: MangaLibDownloader-Linux
          path: ./release

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: MangaLibDownloader-macOS
          path: ./release

      - name: Download Extension
        uses: actions/download-artifact@v4
        with:
          name: browser-extension
          path: ./release

      - name: Show files
        run: |
          echo "=== Release files ==="
          find ./release -type f

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./release/MangaLibDownloader-Windows.exe
            ./release/MangaLibDownloader-Linux
            ./release/MangaLibDownloader-macOS
            ./release/extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
